[package]
name = "overlay"
version.workspace = true
edition = "2024"
description = "Standalone always-on-top WattSeal overlay widget, invoked by the main binary (--overlay)."

[lib]
name = "overlay"
path = "src/lib.rs"

[dependencies]
common = { path = "../common" }
iced = { version = "0.14.0", features = ["advanced", "tokio", "image"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
log = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
